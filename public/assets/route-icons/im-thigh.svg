<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Body: narrower rectangle -->
  <g stroke="#94a3b8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="50" cy="11" r="9"/>
    <path d="M45 19 Q50 22 55 19" stroke-width="2.5"/>
    <rect x="28" y="22" width="44" height="41" rx="8"/>
    <line x1="28" y1="33" x2="10" y2="52"/>
    <line x1="72" y1="33" x2="90" y2="52"/>
    <line x1="38" y1="63" x2="35" y2="87"/>
    <line x1="62" y1="63" x2="65" y2="87"/>
    <line x1="31" y1="87" x2="39" y2="87"/>
    <line x1="61" y1="87" x2="69" y2="87"/>
  </g>
  <!-- IM: syringe from RIGHT → right outer thigh, taller barrel with IM label -->
  <g stroke="#1e40af" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Needle tip at thigh surface -->
    <line x1="66" y1="75" x2="71" y2="75" stroke-width="4"/>
    <!-- Taller barrel (fits IM text) -->
    <rect x="71" y="70" width="14" height="10" rx="2.5" stroke-width="3.5" fill="#bfdbfe"/>
    <!-- IM label on barrel -->
    <text x="78" y="77.5" text-anchor="middle" font-size="6.5" font-weight="800"
          fill="#1e40af" font-family="system-ui,sans-serif" stroke="none">IM</text>
    <!-- Finger flange -->
    <line x1="85" y1="68" x2="85" y2="82" stroke-width="4.5"/>
    <!-- Plunger rod -->
    <line x1="85" y1="75" x2="90" y2="75" stroke-width="4.5"/>
  </g>
</svg>
