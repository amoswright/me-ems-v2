<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Body: narrower rectangle -->
  <g stroke="#94a3b8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="50" cy="11" r="9"/>
    <path d="M45 19 Q50 22 55 19" stroke-width="2.5"/>
    <rect x="28" y="22" width="44" height="41" rx="8"/>
    <line x1="28" y1="33" x2="10" y2="52"/>
    <line x1="72" y1="33" x2="90" y2="52"/>
    <line x1="38" y1="63" x2="35" y2="87"/>
    <line x1="62" y1="63" x2="65" y2="87"/>
    <line x1="31" y1="87" x2="39" y2="87"/>
    <line x1="61" y1="87" x2="69" y2="87"/>
  </g>
  <!-- IO: power drill from LEFT → left lower leg (opposite side from IM) -->
  <g stroke="#1e40af" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Drill bit tip at left lower leg surface -->
    <line x1="34" y1="78" x2="29" y2="78" stroke-width="2.5"/>
    <!-- Chuck -->
    <rect x="24" y="75.5" width="5" height="5" rx="1.5" stroke-width="3"/>
    <!-- Barrel with IO label -->
    <rect x="6" y="73" width="18" height="11" rx="3.5" stroke-width="4" fill="#bfdbfe"/>
    <text x="15" y="80.5" text-anchor="middle" font-size="7" font-weight="800"
          fill="#1e40af" font-family="system-ui,sans-serif" stroke="none">IO</text>
    <!-- Pistol grip -->
    <path d="M19 84 L21 95" stroke-width="5"/>
    <!-- Grip base -->
    <line x1="17" y1="95" x2="25" y2="95" stroke-width="4.5"/>
    <!-- Trigger -->
    <path d="M19 87 L21 91" stroke-width="3"/>
  </g>
</svg>
